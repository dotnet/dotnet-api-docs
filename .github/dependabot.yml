version: 2
updates:
  # Updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # NuGet updates for C++ snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/cpp/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for Microsoft.* C# snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/csharp/Microsoft*/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for System namespace C# snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/csharp/System/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for System.Windows* C# snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/csharp/System.Windows*/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
