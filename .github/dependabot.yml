version: 2
updates:
  # Updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # NuGet updates for C++, PowerShell, XAML, and XML snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/cpp/**/*"
      - "snippets/powershell/**/*"
      - "snippets/xaml/**/*"
      - "snippets/xml/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for Microsoft.* C# snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/csharp/Microsoft*/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
  # NuGet updates for System/A* through System/C* C# snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/csharp/System/A*/**/*"
