      - "snippets/csharp/VS_Snippets*/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for PowerShell snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/powershell/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for VB snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/visualbasic/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
    # NuGet updates for XAML and XML snippets
  - package-ecosystem: "nuget"
    directories:
      - "snippets/xaml/**/*"
      - "snippets/xml/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
        group-by: dependency-name
