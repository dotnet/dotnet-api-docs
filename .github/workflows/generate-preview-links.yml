name: 'Preview link generator'

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview_link_generator_job:
    name: Generate preview link table
    runs-on: ubuntu-latest
    permissions:
      statuses: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: dotnet/docs-tools/actions/preview-link-generator@08478c4511182484a68162251d44a2a254f6c7b4 # main
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN 
          max_wait_time_minutes: 40
